name: build-bt-shim

# 单独编译蓝牙厂商库封装层 libbt-vendor.so（纯用户态库，与内核无关）
#
# === 为什么需要 ===
# 本机（BBK S3 Pro / MT8173）蓝牙走 MTK STP 通道（/dev/stpbt），
# 真正的 STP 逻辑在设备自带的 64 位 libbluetooth_mtk.so。
# 但上层 HAL 要找 libbt-vendor.so 导出 BLUETOOTH_VENDOR_LIB_INTERFACE。
# 原厂只有 32 位版本，64 位 ROM 加载不了 → 本库做薄转发。
#
# v2 修正：旧版基于"内核只允许 open stpbt 一次"的错误假设写了一堆绕圈
# 逻辑（扫 /proc/self/fd、fw_cfg 预热两次、重扫 fd），实测内核可反复
# open/close，这些逻辑是多余的且引入 bug。v2 直接用 dlsym 读 fd 槽。
#
# === 用法 ===
# Actions 页面 → build-bt-shim → Run workflow
# 下载 artifact 里的 libbt-vendor.so，然后：
#   adb root
#   adb push libbt-vendor.so /sdcard/
#   adb shell 'mount -o rw,remount /system; \
#              cp /sdcard/libbt-vendor.so /system/vendor/lib64/libbt-vendor.so; \
#              chmod 644 /system/vendor/lib64/libbt-vendor.so; \
#              mount -o ro,remount /system'
#   adb shell 'settings put global bluetooth_on 1; pm enable com.android.bluetooth'
#   adb reboot

on:
  workflow_dispatch:

jobs:
  shim:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 64 位 ARM 交叉编译器（带重试，防 apt 抖动）
        run: |
          # GitHub runner 偶发 apt 网络抖动（Failed to fetch / Network is
          # unreachable），这里重试 3 次；用 gcc-aarch64 单包，比 clang+llvm
          # 一整套依赖小得多，更不容易被抖动打断。
          for i in 1 2 3; do
            echo "=== apt 尝试 $i/3 ==="
            if sudo apt-get update -qq && \
               sudo apt-get install -y -qq gcc-aarch64-linux-gnu; then
              aarch64-linux-gnu-gcc --version | head -1
              exit 0
            fi
            echo "apt 失败，等待 15s 后重试..."
            sleep 15
          done
          echo "apt 三次都失败"; exit 1

      - name: 编译 libbt-vendor.so
        run: |
          set -e
          SRC=kernel-patches/bt-shim/libbt-vendor.c
          test -f "$SRC" || { echo "缺少 $SRC"; exit 1; }
          mkdir -p out
          # 关键：旧版能加载的 so 有一个 DT_NEEDED: libbluetooth_mtk.so，
          # 动态链接器靠它把 libbluetooth_mtk（及其传递依赖 liblog/libdl）拉进来，
          # 从而解析 init_uart/__android_log_print 等外部符号。
          # v2 用 dlerror、v3 缺 NEEDED 都因此加载失败。
          # 这里造一个空的 stub libbluetooth_mtk.so 只为了让链接器产生 NEEDED 条目
          # （运行时系统会加载真正的那个库）。
          mkdir -p stub
          echo 'void __bt_stub(void){}' > stub/stub.c
          aarch64-linux-gnu-gcc -fPIC -shared -nostdlib -o stub/libbluetooth_mtk.so stub/stub.c

          aarch64-linux-gnu-gcc -fPIC -shared -nostdlib -Os \
            -Lstub -Wl,--no-as-needed -lbluetooth_mtk \
            -o out/libbt-vendor.so "$SRC"
          echo "--- 产物 ---"
          ls -l out/libbt-vendor.so
          file out/libbt-vendor.so || true
          echo "--- DT_NEEDED（必须含 libbluetooth_mtk.so）---"
          aarch64-linux-gnu-readelf -d out/libbt-vendor.so 2>/dev/null | grep NEEDED || true
          echo "--- 导出的符号 ---"
          aarch64-linux-gnu-nm -D out/libbt-vendor.so 2>/dev/null | head -10 || true
          echo "--- 未定义符号 ---"
          aarch64-linux-gnu-nm -D --undefined-only out/libbt-vendor.so 2>/dev/null | head -20 || true
          echo "--- 校验：无 dl* 符号 + 有 libbluetooth_mtk NEEDED ---"
          if aarch64-linux-gnu-nm -D --undefined-only out/libbt-vendor.so 2>/dev/null | grep -qE 'dlopen|dlsym|dlerror'; then
            echo "错误：仍有 dl* 符号!"; exit 1
          fi
          if ! aarch64-linux-gnu-readelf -d out/libbt-vendor.so 2>/dev/null | grep -q libbluetooth_mtk; then
            echo "错误：缺 libbluetooth_mtk.so NEEDED!"; exit 1
          fi
          echo "OK：无 dl* 符号 + libbluetooth_mtk NEEDED 存在"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: bt-shim-${{ github.run_number }}
          path: out/libbt-vendor.so
          if-no-files-found: error
          retention-days: 30
