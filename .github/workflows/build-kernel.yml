name: build-s3pro-kernel

# 用法：把本仓库推到 GitHub，把原厂 boot.img 放到 inputs/boot.img，
# 然后 Actions 页面点 "Run workflow"。编完在 Artifacts 里下 boot.img。
# 只允许手动触发：上传文件、改脚本都不会自动开跑，
# 省得你传个 boot.img 就白烧 30 分钟免费额度。
on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: '内核源码 git 地址'
        default: 'https://github.com/Haoduo9/android_kernel_bbk_h3000s.git'
        required: true
      kernel_branch:
        description: '分支（H3000S 移植树是 lineage-15.1-h3000s）'
        default: 'lineage-15.1-h3000s'
        required: true
      defconfig:
        description: 'defconfig 名（H3000S 用 h3000s_defconfig，放在 inputs/defconfig 亦可）'
        default: 'h3000s_defconfig'
        required: true
      kernel_target:
        description: 'make 目标（Image / Image.gz-dtb）'
        default: 'Image'
        required: true
      toolchain:
        description: '工具链'
        type: choice
        options: [gcc49, host]
        default: gcc49
      dry_run:
        description: '只验证工具链/源码/配置，不编译（第一次接新树建议先跑）'
        type: boolean
        default: false
      lcm_trace:
        description: '面板推表诊断日志（pr_alert，查命令有没有发到面板；只加日志不改逻辑）'
        type: boolean
        default: false
      lcm_power_seq:
        description: '实验：反转面板 GPIO 上电顺序（先供电后复位，验证黑屏根因；默认关）'
        type: boolean
        default: false
      lcm_readid:
        description: '面板回读探针 mtk_lcm_s3pro_readback（切 CMD 后读 0x0A/0xDA/0xDB，读完切回）。用它可一刀切判断「面板到底还能不能通信」：0x0A 读回 0x9C=面板正常，0x00=面板没电/没初始化。黑屏排查期间建议保持开启（默认开）'
        type: boolean
        default: true

      stock_timing:
        description: '★★核心修复：时序 40/40/4/200/200 + PLL_CLOCK 500 + noncont_clock=1 + vertical_vfp_lp=0(禁 idle 动态帧率) + ufoe_enable=1(与 LOS 实测一致)，全部对齐 LOS 14.1 实测（默认开，务必保持开）'
        type: boolean
        default: true
      resume_no_wait_token:
        description: '★★★★核心：去掉 primary_display_resume 里 video mode 的 _cmdq_insert_wait_frame_done_token。LOS 14.1 的 resume(457 条反汇编)里这一调用 0 处，video 分支只调 dpmgr_path_trigger 就 start_loop；我们多插了一条「等事件 53」，而 DSI_START 已被清 0 → 53 永不来 → config 队列死锁（默认开）'
        type: boolean
        default: true
      dsi_config_start:
        description: '[已证伪·默认关] 在 ddp_dsi_config 出口补 DSI_Start。2026-11-25 实测：config 阶段 DSI_MODE_CTRL.MODE 还是 CMD(0)，此时启动 DSI 会让它进入 busy，而 _dsi_is_video_mode() 读寄存器返回 0 → DSI_WaitForNotBusy 走等待路径超时 #572 次；更严重的是 ddp_dsi_stop 里两个 while(1) 死等 busy 清除 → dsi1 is busy 反复打印 → suspend 卡死 → 黑屏。必须关闭'
        type: boolean
        default: false
      no_stop_loop:
        description: '★★★核心：让 primary_display_suspend 不再停 CMDQ trigger loop（LOS 14.1 逆向确认它不停）。停掉后 resume 重启的 loop 卡在 cmdqRecWait(MUTEX0_STREAM_EOF) 上死锁（默认开）'
        type: boolean
        default: true
      vdo_eof_event:
        description: '[已证伪·默认关] 在 video mode 的 trigger loop 启动后软件伪造 MUTEX0_STREAM_EOF(53)。2026-11-25 实测：dmesg 打出 is_idle=0（MTK 原本的 if 会跳过）、改成无条件后事件设了但 trig 仍为 0 → 无效。且无条件设事件可能干扰 CMDQ 状态机，故默认关闭'
        type: boolean
        default: false
      lcm_init_table:
        description: '★★核心：让 lcm_init 做三级选表+推表（vendor id / pio89 电平 → 23/109 项），对齐 LOS 14.1；开机时 kernel 就推表而不是全靠 LK（默认开）'
        type: boolean
        default: true
      lcm_esd_off:
        description: '[默认开·临时] 关闭面板 ESD 自检。LOS 14.1 的 ESD 是开的且正常，但我们的显示异常时 display_esd_che 会反复 esd_recovery 干扰点火验证；显示修好后应关掉此项恢复对齐'
        type: boolean
        default: true
      lab_push:
        description: '在线重推表实验台：刷机后 echo 0x9999/0x9998/0x9997 > fb_dispparam 可在线推表，免重刷（默认关）'
        type: boolean
        default: false
      lk_replay:
        description: '★时序实验台：debugfs 切 上电顺序(variant 0-4)/三个复位延时/vsn_dly/repeat/table/no_power，一次刷机做受控实验，改完下次熄屏唤醒即生效（默认开）'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # 先跑一遍本地自测，保证 boot.img 处理逻辑没被改坏
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bootimg 往返测试
        run: python3 tests/test_bootimg.py
      - name: build.sh 结构检查（本机没有 bash，用启发式检查器兜底）
        run: python3 tests/test_sh_syntax.py
      - name: 工作流自身结构检查
        run: python3 tests/test_workflow.py
      - name: TWRP 模块打包检查
        run: python3 tests/test_twrp_zip.py
      - name: 屏驱动补丁测试（在 mock 树里用真实 bash 跑那段 sed）
        run: python3 tests/test_lcm_patch.py
      - name: 面板补丁链验证（默认开关下生成原厂配置：BOE表+原厂时序）
        run: python3 tests/test_panel_patch_chain.py
      - name: 补丁标记与驱动清单静态自检（防「编译通过但补丁没生效」）
        run: python3 tests/test_patch_marks.py

  build:
    needs: selftest
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: 补丁实现审计（生成代码里是否真有预期改动）
        run: |
          set -e
          python3 tests/test_patch_implementation.py

      - name: 显示输入
        run: |
          echo "repo      = ${{ inputs.kernel_repo || 'Haoduo9/android_kernel_bbk_h3000s' }}"
          echo "branch    = ${{ inputs.kernel_branch || 'lineage-15.1-h3000s' }}"
          echo "defconfig = ${{ inputs.defconfig || 'h3000s_defconfig' }}"
          echo "target    = ${{ inputs.kernel_target || 'Image' }}"
          echo "toolchain = ${{ inputs.toolchain || 'gcc49' }}"
          ls -la inputs/ 2>/dev/null || echo "（inputs/ 为空）"

      - name: 体检 inputs/（Treble / 内核版本 / 分区）
        if: always()
        run: |
          {
            echo '### inputs/ 体检报告'
            echo '```'
            python3 scripts/analyze_dump.py inputs 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 编译内核并打包 boot.img
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo || 'https://github.com/Haoduo9/android_kernel_bbk_h3000s.git' }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch || 'lineage-15.1-h3000s' }}
          DEFCONFIG: ${{ inputs.defconfig || 'h3000s_defconfig' }}
          KERNEL_TARGET: ${{ inputs.kernel_target || 'Image' }}
          TOOLCHAIN: ${{ inputs.toolchain || 'gcc49' }}
          DRY_RUN: ${{ (inputs.dry_run && '1') || '0' }}
          LCM_TRACE: ${{ (inputs.lcm_trace && '1') || '0' }}
          LCM_POWER_SEQ: ${{ (inputs.lcm_power_seq && '1') || '0' }}
          LCM_READID: ${{ (inputs.lcm_readid && '1') || '0' }}
          STOCK_TIMING: ${{ (inputs.stock_timing && '1') || '0' }}
          RESUME_NO_WAIT_TOKEN: ${{ (inputs.resume_no_wait_token && '1') || '0' }}
          DSI_CFG_START: ${{ (inputs.dsi_config_start && '1') || '0' }}
          NO_STOP_LOOP: ${{ (inputs.no_stop_loop && '1') || '0' }}
          VDO_EOF_EVENT: ${{ (inputs.vdo_eof_event && '1') || '0' }}
          LCM_INIT_TABLE: ${{ (inputs.lcm_init_table && '1') || '0' }}
          LCM_ESD_OFF: ${{ (inputs.lcm_esd_off && '1') || '0' }}
          LAB_PUSH: ${{ (inputs.lab_push && '1') || '0' }}
          LK_REPLAY: ${{ (inputs.lk_replay && '1') || '0' }}
        run: bash scripts/build.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: s3pro-kernel-${{ github.run_number }}
          path: |
            out/boot.img
            out/Image*
            out/*.sha256
            out/build-info.txt
            out/build.log
          if-no-files-found: warn
          retention-days: 30

      - name: 摘要
        if: always()
        run: |
          {
            echo '### 构建结果'
            echo '```'
            cat out/build-info.txt 2>/dev/null || echo '未生成 build-info.txt'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
