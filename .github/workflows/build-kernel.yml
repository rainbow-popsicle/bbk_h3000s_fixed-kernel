name: build-s3pro-kernel

# 用法：把本仓库推到 GitHub，把原厂 boot.img 放到 inputs/boot.img，
# 然后 Actions 页面点 "Run workflow"。编完在 Artifacts 里下 boot.img。
# 只允许手动触发：上传文件、改脚本都不会自动开跑，
# 省得你传个 boot.img 就白烧 30 分钟免费额度。
on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: '内核源码 git 地址'
        default: 'https://github.com/Haoduo9/android_kernel_bbk_h3000s.git'
        required: true
      kernel_branch:
        description: '分支（H3000S 移植树是 lineage-15.1-h3000s）'
        default: 'lineage-15.1-h3000s'
        required: true
      defconfig:
        description: 'defconfig 名（H3000S 用 h3000s_defconfig，放在 inputs/defconfig 亦可）'
        default: 'h3000s_defconfig'
        required: true
      kernel_target:
        description: 'make 目标（Image / Image.gz-dtb）'
        default: 'Image'
        required: true
      toolchain:
        description: '工具链'
        type: choice
        options: [gcc49, host]
        default: gcc49
      dry_run:
        description: '只验证工具链/源码/配置，不编译（第一次接新树建议先跑）'
        type: boolean
        default: false
      lcm_trace:
        description: '面板推表诊断日志（pr_alert，查命令有没有发到面板；只加日志不改逻辑）'
        type: boolean
        default: false
      lcm_power_seq:
        description: '实验：反转面板 GPIO 上电顺序（先供电后复位，验证黑屏根因；默认关）'
        type: boolean
        default: false
      lcm_readid:
        description: 'read_id 面板回读探针（切CMD回读0x0A/ID；切模式函数由默认开启的 DISP_DEBUG 提供；默认关）'
        type: boolean
        default: false
      video_kick:
        description: 'video_kick 诊断节点（黑屏态强制触发视频流，验证 trigger loop 死锁；依赖 DISP_DEBUG；默认关）'
        type: boolean
        default: false
      vmcmd:
        description: 'vmcmd 诊断节点（清 DSI_START 的 VM_CMD_START bit16 悬挂；黑屏态 echo snap/clr/restart；默认关）'
        type: boolean
        default: false
      dsi_start_fix:
        description: '[空操作·可关] 移除 ddp_dsi_start 里的 DSI_Start()；实测源码里从没有那个标记块，开关无效果，已默认关'
        type: boolean
        default: false
      dsi_start_en:
        description: '[已排除·默认关] 在 ddp_dsi_start 末尾补 DSI_Start()。§3 第6/14条 + 18:09 实验4 已证明 START=1 仍黑，仅保留作对照'
        type: boolean
        default: false
      dimming_early:
        description: '[默认关·先排除干扰] dimming(0x53/0x2C) 前移到 lcm_resume 在 CMD mode 同步推表；会多推一次表，验证 PLL 根因期间先关掉'
        type: boolean
        default: false
      dimming_cmdmode:
        description: '[已证伪·勿开] 旧方案：CPU 裸写 MODE 切 CMD 推 dimming，会触发 CMDQ 风暴；与 dimming_early 互斥（默认关）'
        type: boolean
        default: false
      rst_new_fix:
        description: '[已证伪·可关] 补回 RST_EN_NEW(pio6397)：实测两个 RST 都是 1016 同一脚，空操作（默认关）'
        type: boolean
        default: false
      stock_timing:
        description: '★★核心修复：时序 40/40/4/200/200 + PLL_CLOCK 500 + noncont_clock=1 + vertical_vfp_lp=0(禁 idle 动态帧率) + ufoe_enable=0，全部对齐 LOS 14.1 实测（默认开，务必保持开）'
        type: boolean
        default: true
      lcm_init_table:
        description: '★★核心：让 lcm_init 做三级选表+推表（vendor id / pio89 电平 → 23/109 项），对齐 LOS 14.1；开机时 kernel 就推表而不是全靠 LK（默认开）'
        type: boolean
        default: true
      lcm_esd_off:
        description: '[默认关·对齐 LOS 14.1] 关闭面板 ESD 自检。LOS 14.1 的 ESD 是开的(need_do_esd_check=1)且能正常点亮，所以默认不再关它'
        type: boolean
        default: false
      sharp_tables:
        description: '[已作废·勿开] 换表方向无效，真正差异在时序参数（默认关）'
        type: boolean
        default: false
      lab_push:
        description: '在线重推表实验台：刷机后 echo 0x9999/0x9998/0x9997 > fb_dispparam 可在线推表，免重刷（默认关）'
        type: boolean
        default: false
      lk_replay:
        description: '★时序实验台：debugfs 切 上电顺序(variant 0-4)/三个复位延时/vsn_dly/repeat/table/no_power，一次刷机做受控实验，改完下次熄屏唤醒即生效（默认开）'
        type: boolean
        default: true
      lcm_gpio_fix:
        description: '[默认关·已由前置 sed 覆盖] 面板 GPIO 补丁：node/属性名两级回退；build.sh 里已有等价 sed，重复会因锚点不匹配而失败'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # 先跑一遍本地自测，保证 boot.img 处理逻辑没被改坏
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bootimg 往返测试
        run: python3 tests/test_bootimg.py
      - name: build.sh 结构检查（本机没有 bash，用启发式检查器兜底）
        run: python3 tests/test_sh_syntax.py
      - name: 工作流自身结构检查
        run: python3 tests/test_workflow.py
      - name: TWRP 模块打包检查
        run: python3 tests/test_twrp_zip.py
      - name: 屏驱动补丁测试（在 mock 树里用真实 bash 跑那段 sed）
        run: python3 tests/test_lcm_patch.py
      - name: 面板补丁链验证（默认开关下生成原厂配置：BOE表+原厂时序）
        run: python3 tests/test_panel_patch_chain.py

  build:
    needs: selftest
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: 显示输入
        run: |
          echo "repo      = ${{ inputs.kernel_repo || 'Haoduo9/android_kernel_bbk_h3000s' }}"
          echo "branch    = ${{ inputs.kernel_branch || 'lineage-15.1-h3000s' }}"
          echo "defconfig = ${{ inputs.defconfig || 'h3000s_defconfig' }}"
          echo "target    = ${{ inputs.kernel_target || 'Image' }}"
          echo "toolchain = ${{ inputs.toolchain || 'gcc49' }}"
          ls -la inputs/ 2>/dev/null || echo "（inputs/ 为空）"

      - name: 体检 inputs/（Treble / 内核版本 / 分区）
        if: always()
        run: |
          {
            echo '### inputs/ 体检报告'
            echo '```'
            python3 scripts/analyze_dump.py inputs 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 编译内核并打包 boot.img
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo || 'https://github.com/Haoduo9/android_kernel_bbk_h3000s.git' }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch || 'lineage-15.1-h3000s' }}
          DEFCONFIG: ${{ inputs.defconfig || 'h3000s_defconfig' }}
          KERNEL_TARGET: ${{ inputs.kernel_target || 'Image' }}
          TOOLCHAIN: ${{ inputs.toolchain || 'gcc49' }}
          DRY_RUN: ${{ (inputs.dry_run && '1') || '0' }}
          LCM_TRACE: ${{ (inputs.lcm_trace && '1') || '0' }}
          LCM_POWER_SEQ: ${{ (inputs.lcm_power_seq && '1') || '0' }}
          LCM_READID: ${{ (inputs.lcm_readid && '1') || '0' }}
          VIDEO_KICK: ${{ (inputs.video_kick && '1') || '0' }}
          VMCMD: ${{ (inputs.vmcmd && '1') || '0' }}
          DSI_START_FIX: ${{ (inputs.dsi_start_fix && '1') || '0' }}
          DSI_START_EN: ${{ (inputs.dsi_start_en && '1') || '0' }}
          DIMMING_CMDMODE: ${{ (inputs.dimming_cmdmode && '1') || '0' }}
          DIMMING_EARLY: ${{ (inputs.dimming_early && '1') || '0' }}
          RST_NEW_FIX: ${{ (inputs.rst_new_fix && '1') || '0' }}
          SHARP_TABLES: ${{ (inputs.sharp_tables && '1') || '0' }}
          STOCK_TIMING: ${{ (inputs.stock_timing && '1') || '0' }}
          LCM_INIT_TABLE: ${{ (inputs.lcm_init_table && '1') || '0' }}
          LCM_ESD_OFF: ${{ (inputs.lcm_esd_off && '1') || '0' }}
          LAB_PUSH: ${{ (inputs.lab_push && '1') || '0' }}
          LK_REPLAY: ${{ (inputs.lk_replay && '1') || '0' }}
          LCM_GPIO_FIX: ${{ (inputs.lcm_gpio_fix && '1') || '0' }}
        run: bash scripts/build.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: s3pro-kernel-${{ github.run_number }}
          path: |
            out/boot.img
            out/Image*
            out/*.sha256
            out/build-info.txt
            out/build.log
          if-no-files-found: warn
          retention-days: 30

      - name: 摘要
        if: always()
        run: |
          {
            echo '### 构建结果'
            echo '```'
            cat out/build-info.txt 2>/dev/null || echo '未生成 build-info.txt'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
